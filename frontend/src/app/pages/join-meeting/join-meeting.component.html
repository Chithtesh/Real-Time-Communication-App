<div class="container py-4" style="max-width:520px">
  <div class="card dash-card p-4">
    <h4 class="mb-3"><i class="fa-solid fa-right-to-bracket me-2"></i>Join a Meeting</h4>
    <div class="alert alert-danger py-2" *ngIf="error">{{ error }}</div>
    <div class="mb-3">
      <label class="form-label">Meeting ID</label>
      <input class="form-control text-uppercase" [(ngModel)]="meetingId" placeholder="CONNECT-XXXXX" (keyup.enter)="join()">
    </div>
    <button class="btn btn-primary w-100" (click)="join()" [disabled]="loading">{{ loading ? 'Joining...' : 'Join Meeting' }}</button>
  </div>
</div>
